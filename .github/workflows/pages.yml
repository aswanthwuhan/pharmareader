name: Deploy PWA to GitHub Pages

# Publishes https://aswanthwuhan.github.io/pharmareader/ — the app is built with
# VITE_BASE=/pharmareader/ so every asset, the router basename and the service
# worker live under that sub-path.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No packageManager field in package.json, so pin the major here.
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (Pages sub-path)
        run: pnpm build
        env:
          VITE_BASE: /pharmareader/

      # GitHub Pages has no SPA rewrite: a deep link such as /pharmareader/read/abc
      # is served 404.html, which must be the app shell so the router can take over.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
