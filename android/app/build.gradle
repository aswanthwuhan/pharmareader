apply plugin: 'com.android.application'

// --- Release signing: prepared, but inactive until a keystore exists ---------------------------
// The shipped APK is currently signed with whatever debug key the build machine had, which is
// why an upgrade from another machine needs an uninstall (and wipes the WebView's notes).
// Create android/keystore.properties (git-ignored) with storeFile, storePassword, keyAlias and
// keyPassword and assembleRelease signs with it; with no such file the release build is left
// unsigned exactly as before, so this changes nothing until the lead activates it.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll {
        !keystoreProperties[it]
    }
    if (!missing.isEmpty()) {
        throw new GradleException(
            "android/keystore.properties is missing ${missing.join(', ')}. " +
            "Expected keys: storeFile, storePassword, keyAlias, keyPassword.")
    }
    if (!rootProject.file(keystoreProperties['storeFile']).exists()) {
        throw new GradleException(
            "android/keystore.properties points at ${keystoreProperties['storeFile']}, " +
            "which does not exist relative to android/.")
    }
}

android {
    namespace = "com.aurapharmlab.pharmareader"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aurapharmlab.pharmareader"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "0.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // sherpa-onnx ships x86/x86_64 ONNX runtime builds too, but release only ever runs
        // on a real phone: dropping the emulator ABIs saves ~70 MB of APK. Debug adds
        // x86_64 back (see buildTypes.debug) so the app is testable on the x86_64 emulator.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Only defined when android/keystore.properties exists; `buildTypes.release` below is
        // then the only build type that uses it.
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Union with defaultConfig's filters: debug APKs also carry x86_64 natives so
            // the whole app (incl. sherpa-onnx Kokoro) can be exercised on the emulator.
            ndk {
                abiFilters 'x86_64'
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // On-device Kokoro speech: prebuilt sherpa-onnx Android AAR (Apache-2.0, bundles
    // onnxruntime + espeak-ng GPL-3.0). See android/app/src/main/java/.../kokoro/.
    implementation files('libs/sherpa-onnx-1.13.8.aar')
    // The AAR is a Kotlin library; a local .aar brings no POM, so its runtime deps come
    // from here.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    // bzip2 + tar for the runtime model download (Apache-2.0). The jar is vendored in
    // libs/ rather than pulled from Maven Central, which this build machine cannot reach
    // for this artifact. Its runtime deps commons-io + commons-lang3 come in via the
    // fileTree('libs') line above (issue #1: NoClassDefFoundError CountingInputStream).
    implementation files('libs/commons-compress-1.26.2.jar')

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
